<div class="header-ministria">

  <h1 class="titulo-app">
    MINISTRIA
  </h1>

  <p class="eslogan">
    Organiza tu servicio. Proyecta tu mensaje.
  </p>

</div>

<div class="tabs">

  <button>
    📖 Biblia
  </button>

  <button
    (click)="abrirAlabanzas()">
    🎵 Alabanzas
  </button>

  <button
  (click)="abrirMultimedia()">
  📢 Multimedia
</button>

<button
  (click)="abrirServicio()">
  📋 Servicio
</button>

</div>

<h1>📖 Biblia</h1>

<input
  [(ngModel)]="referencia"
  placeholder="Juan 3:16"
/>

<button
  (click)="buscarVersiculo()">
  Buscar
</button>

<div class="versiculo-card">

  <div class="info-versiculo">

    <span class="referencia">
      {{ referencia }}
    </span>

    <span class="version">
      RV60
    </span>

  </div>

  <p class="versiculo-texto">
    {{ resultado }}
  </p>

  <div class="acciones">

    <button
      (click)="agregarAlServicio()">
      ➕ Añadir al Servicio
    </button>

    <button>
      🤖 Crear Imagen IA
    </button>

  </div>

</div>
